<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语小镇 · 句型冒险</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF4E8;
    --paper2:#FFFDF8;
    --ink:#1F2A28;
    --ink-soft:#5C6864;
    --orange:#E4572E;
    --teal:#2A9D8F;
    --sun:#F2B93B;
    --blue:#3E6FD1;
    --pink:#E0698E;
    --green:#3FA34D;
    --mint:#DDF1EC;
    --peach:#FFE8D6;
    --sky:#E7ECFB;
    --butter:#FBF0C9;
    --radius:22px;
    --display:'Fredoka','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background-color:var(--paper);
    background-image:radial-gradient(circle, rgba(31,42,40,.085) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Nunito','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overflow-x:hidden;
  }
  button{font-family:inherit;color:inherit}
  ::selection{background:var(--sun);color:var(--ink)}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px}

  /* topbar */
  .topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
    padding:10px clamp(14px,4vw,38px);
    background:rgba(250,244,232,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:2px solid rgba(31,42,40,.12);
  }
  .brand{display:flex;align-items:center;gap:11px;background:none;border:0;cursor:pointer;padding:2px;text-align:left}
  .brand-mark{
    width:44px;height:44px;flex:none;display:grid;place-items:center;
    background:var(--teal);color:var(--paper2);border:2.5px solid var(--ink);border-radius:13px;
    box-shadow:0 3px 0 var(--ink);transform:rotate(-4deg);
    font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;
    transition:transform .2s;
  }
  .brand:hover .brand-mark{transform:rotate(3deg) scale(1.04)}
  .brand-text h1{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
  .brand-text p{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;margin-top:2px}
  .top-spacer{flex:1}
  .star-pill{
    display:flex;align-items:center;gap:7px;border:2.5px solid var(--ink);border-radius:99px;
    background:var(--paper2);padding:7px 14px 7px 11px;box-shadow:0 3px 0 var(--ink);
    font-family:var(--display);font-weight:600;font-size:15px;
  }
  .star-pill .glyph{color:var(--sun);font-size:17px}
  .icon-btn{
    width:44px;height:44px;flex:none;display:grid;place-items:center;
    border:2.5px solid var(--ink);border-radius:14px;background:var(--paper2);
    box-shadow:0 3px 0 var(--ink);cursor:pointer;font-size:17px;
    transition:transform .12s,box-shadow .12s,background .15s;
  }
  .icon-btn:hover{background:#FFF6E3}
  .icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
  .icon-btn svg{width:22px;height:22px;display:block}

  .screen{display:none}
  .screen.active{display:block;animation:screenIn .38s cubic-bezier(.2,.8,.2,1)}
  @keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .page{max-width:1060px;margin:0 auto;padding:clamp(20px,4vw,38px) clamp(14px,4vw,30px) 90px}

  /* town hero */
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
  .eyebrow::before{content:'';width:22px;height:2px;background:var(--ink);border-radius:2px}
  .town-hero{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin:4px 0 22px}
  .town-hero h2{font-family:var(--display);font-size:clamp(38px,7vw,62px);line-height:1.02;letter-spacing:-.025em}
  .town-hero h2 .hl{position:relative;display:inline-block;z-index:0}
  .town-hero h2 .hl::after{content:'';position:absolute;left:-1%;right:-1%;bottom:7%;height:32%;background:var(--sun);border-radius:6px;z-index:-1;transform:rotate(-1.4deg)}
  .town-hero p{max-width:46ch;font-size:14.5px;line-height:1.7;color:var(--ink-soft);font-weight:600;margin-top:14px;text-wrap:pretty}
  .town-progress{
    margin-left:auto;min-width:210px;border:2.5px solid var(--ink);border-radius:18px;background:var(--paper2);
    padding:12px 16px;box-shadow:0 4px 0 var(--ink);
  }
  .town-progress .row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:7px}
  .town-progress b{font-family:var(--display);font-size:16px;color:var(--ink);font-weight:600}
  .town-progress .bar{height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
  .town-progress .bar i{display:block;height:100%;width:0;background:var(--teal);border-right:2px solid var(--ink);transition:width .5s}

  .town-route{display:flex;align-items:center;gap:10px;margin:6px 0 24px;font-size:24px}
  .town-route i{flex:1;height:0;border-top:3px dashed rgba(31,42,40,.22)}
  .town-route span{width:46px;height:46px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper2);box-shadow:0 3px 0 var(--ink);font-size:23px}

  /* location cards */
  .town-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,2.4vw,18px)}
  .loc{
    border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--paper2);
    box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;
    transition:transform .18s,box-shadow .18s;
  }
  .loc:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
  .loc-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:2.5px solid var(--ink);background:var(--tint)}
  .loc-emoji{
    width:48px;height:48px;flex:none;display:grid;place-items:center;font-size:26px;
    background:var(--paper2);border:2.5px solid var(--ink);border-radius:13px;
    box-shadow:0 3px 0 var(--ink);transform:rotate(-3deg);
  }
  .loc-head h3{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
  .loc-head p{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:3px}
  .loc-badge{margin-left:auto;font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
  .loc-body{padding:9px;display:flex;flex-direction:column;gap:5px;flex:1}
  .act-row{
    display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:14px;
    border:2px solid transparent;background:transparent;cursor:pointer;text-align:left;
    transition:background .15s,border-color .15s,transform .12s;
  }
  .act-row:hover{background:#FFF6E3;border-color:rgba(31,42,40,.16)}
  .act-row:active{transform:scale(.99)}
  .act-row .ico{
    width:36px;height:36px;flex:none;display:grid;place-items:center;font-size:19px;
    background:var(--paper);border:2px solid var(--ink);border-radius:10px;
  }
  .act-row .txt{flex:1;min-width:0}
  .act-row .name{display:block;font-family:var(--display);font-size:15px;font-weight:600;line-height:1.15}
  .act-row .desc{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:2px;line-height:1.35}
  .act-row .stars{display:inline-flex;gap:2px;font-size:13px;line-height:1;flex:none}
  .act-row .stars .s{color:#D8D0BF}
  .act-row .stars .s.on{color:var(--sun)}
  .act-row .go{font-size:15px;opacity:.35;flex:none}

  .town-foot{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft)}
  .studio-note{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-top:2px dashed rgba(31,42,40,.2);margin-top:5px;padding:14px 8px 6px;text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;line-height:1.5}
  .studio-note .big{font-size:36px;line-height:1.2}
  .studio-note b{font-family:var(--display);font-size:14px;color:var(--ink);font-weight:600}
  .link-btn{background:none;border:0;font-size:12px;font-weight:800;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .link-btn:hover{color:var(--ink)}
  .back-link{color:var(--ink);font-weight:800;text-decoration:none;border-bottom:2px solid var(--sun);padding-bottom:1px}

  /* activity shared */
  .act-body{max-width:820px;margin:0 auto}
  .act-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .act-head .back{
    width:46px;height:46px;flex:none;display:grid;place-items:center;
    border:2.5px solid var(--ink);border-radius:14px;background:var(--paper2);
    box-shadow:0 3px 0 var(--ink);font-size:20px;cursor:pointer;
    transition:transform .12s,box-shadow .12s;
  }
  .act-head .back:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
  .act-head h2{font-family:var(--display);font-size:clamp(22px,3.4vw,28px);font-weight:600;letter-spacing:-.01em;line-height:1.1}
  .act-head p{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:3px}
  .gh-stars{margin-left:auto;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-soft);white-space:nowrap}

  .progress{height:13px;border:2.5px solid var(--ink);border-radius:99px;background:var(--paper2);overflow:hidden;margin:14px 0 6px}
  .progress i{display:block;height:100%;width:0;background:var(--teal);border-right:2px solid var(--ink);transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .progress.sun i{background:var(--sun)}
  .progress.orange i{background:var(--orange)}
  .progress.blue i{background:var(--blue)}
  .prog-row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:14px}

  .panel{
    border:2.5px solid var(--ink);border-radius:24px;background:var(--paper2);
    box-shadow:0 6px 0 var(--ink);padding:clamp(16px,3vw,24px);
  }
  .prompt-center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center}
  .prompt-tag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .prompt-word{font-family:var(--display);font-size:clamp(24px,4.6vw,36px);font-weight:600;line-height:1.15;letter-spacing:-.01em;text-wrap:pretty}
  .prompt-zh{font-size:13px;font-weight:800;color:var(--ink-soft);line-height:1.6}

  .big-speaker{
    width:104px;height:104px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);
    box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;cursor:pointer;
    transition:transform .12s,box-shadow .12s,background .15s;
  }
  .big-speaker svg{width:44px;height:44px}
  .big-speaker:hover{background:#FFC94D}
  .big-speaker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .big-speaker.playing{animation:speakerPulse .5s ease}
  @keyframes speakerPulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .mini-speaker{
    display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:99px;
    background:var(--paper2);padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;
    box-shadow:0 2px 0 var(--ink);
  }
  .mini-speaker:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}

  .btn{
    border:2.5px solid var(--ink);border-radius:14px;background:var(--paper2);
    padding:11px 18px;font-family:var(--display);font-size:15px;font-weight:600;
    box-shadow:0 4px 0 var(--ink);cursor:pointer;
    transition:transform .12s,box-shadow .12s,background .15s;
  }
  .btn:hover{background:#FFF6E3}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.primary{background:var(--sun)}
  .btn.primary:hover{background:#FFC94D}
  .btn.teal{background:var(--teal);color:var(--paper2)}
  .btn.teal:hover{background:#238A7D}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}

  .feedback{
    max-width:660px;margin:14px auto 0;padding:11px 15px;border:2px solid var(--ink);
    border-radius:13px;background:var(--butter);font-size:13px;font-weight:800;
    box-shadow:0 3px 0 var(--ink);line-height:1.55;animation:screenIn .3s;
  }
  .feedback.good{background:#D8F0DF;border-color:#1E7D6F;box-shadow:0 3px 0 #1E7D6F}
  .feedback.bad{background:#FBE0D9;border-color:#C53F1B;box-shadow:0 3px 0 #C53F1B}

  /* photo */
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .photo-opt{
    border:2.5px solid var(--ink);border-radius:18px;background:var(--paper2);
    box-shadow:0 4px 0 var(--ink);padding:8px;cursor:pointer;position:relative;
    transition:transform .14s,box-shadow .14s,background .15s;
  }
  .photo-opt:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--ink);background:#FFF9EC}
  .photo-opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
  .photo-frame{
    height:clamp(104px,17vw,132px);display:grid;place-items:center;
    background:var(--paper);border:2px solid rgba(31,42,40,.14);border-radius:12px;overflow:hidden;
  }
  .photo-frame .ph-emoji{font-size:clamp(48px,9vw,64px);line-height:1}
  .photo-frame .ph-row{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px;font-size:clamp(30px,6vw,44px);line-height:1;letter-spacing:2px}
  .photo-frame .ph-row .shape-svg{width:36px;height:36px}
  .photo-frame .ph-single .shape-svg{width:64px;height:64px}
  .photo-frame .ph-color{width:76px;height:76px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:42px;border:2px solid var(--ink)}
  .photo-frame .ph-room{width:92px;height:70px;border-radius:12px;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center;font-size:38px}
  .photo-frame .ph-small{font-size:24px}
  .photo-opt .tag{
    position:absolute;left:12px;top:10px;width:22px;height:22px;display:grid;place-items:center;
    background:var(--paper2);border:2px solid var(--ink);border-radius:50%;
    font-family:var(--display);font-size:11px;font-weight:600;
  }
  .photo-opt.correct{background:#D8F0DF;border-color:#1E7D6F;box-shadow:0 4px 0 #1E7D6F}
  .photo-opt.wrong{background:#FBE0D9;border-color:#C53F1B;box-shadow:0 4px 0 #C53F1B;animation:shake .36s}
  .photo-opt.reveal{outline:3px dashed #1E7D6F;outline-offset:2px}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .photo-flash{position:fixed;inset:0;background:#fff;z-index:90;pointer-events:none;opacity:0}
  .photo-flash.go{animation:flash .45s ease}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  /* train */
  .train-panel{overflow:hidden}
  .train-line{display:flex;align-items:center;gap:8px;padding:14px 4px 10px;overflow-x:auto;scrollbar-width:thin;justify-content:center}
  .engine{font-size:40px;line-height:1;flex:none;filter:drop-shadow(0 3px 0 rgba(31,42,40,.18))}
  .carriage{
    flex:0 1 auto;min-width:64px;max-width:96px;height:58px;padding:6px 9px;border-radius:10px;
    border:2.5px dashed rgba(31,42,40,.35);background:var(--paper);
    display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:600;
    cursor:pointer;transition:background .15s,border-color .15s;line-height:1.12;white-space:normal;word-break:break-word;
  }
  .carriage.filled{border-style:solid;border-color:var(--ink);background:var(--butter);box-shadow:0 3px 0 var(--ink)}
  .carriage:empty::after{content:'?';font-size:18px;color:rgba(31,42,40,.25)}
  .train-line.drive{animation:drive .9s cubic-bezier(.4,0,.2,1)}
  @keyframes drive{0%{transform:translateX(0)}30%{transform:translateX(10px)}100%{transform:translateX(0)}}
  .train-line.shake{animation:shake .36s}
  .word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
  .wchip{
    border:2px solid var(--ink);border-radius:11px;background:var(--paper2);
    padding:8px 12px;font-family:var(--display);font-size:14px;font-weight:600;
    box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;
  }
  .wchip:hover{background:#FFF6E3}
  .wchip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
  .wchip.used{opacity:.22;pointer-events:none}

  /* shop */
  .shop-scene{
    position:relative;border:2.5px solid var(--ink);border-radius:20px;background:var(--peach);
    padding:18px 16px 14px;margin-bottom:14px;overflow:hidden;
  }
  .shop-scene::before{
    content:'';position:absolute;left:0;right:0;bottom:0;height:42px;
    background:repeating-linear-gradient(90deg,#E9B98B 0 18px,#F3CEAA 18px 36px);
    border-top:2px solid var(--ink);
  }
  .shopkeeper{font-size:52px;line-height:1;position:relative;z-index:1;flex:none}
  .shop-row{display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1}
  .bubble{
    position:relative;z-index:1;margin:0;background:var(--paper2);
    border:2.5px solid var(--ink);border-radius:16px;padding:12px 15px;
    font-family:var(--display);font-size:clamp(16px,2.8vw,20px);font-weight:600;
    box-shadow:0 3px 0 var(--ink);max-width:520px;line-height:1.35;flex:1;
  }
  .bubble.zh{font-family:'Nunito','PingFang SC',sans-serif;font-size:14px;font-weight:800}
  .bag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink-soft);margin:10px 0 14px;flex-wrap:wrap;background:var(--paper2);border:2px solid var(--ink);border-radius:12px;padding:7px 11px;box-shadow:0 3px 0 var(--ink);width:fit-content}
  .bag .item{width:32px;height:32px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:9px;font-size:19px;box-shadow:0 2px 0 var(--ink)}
  .shop-options{display:flex;flex-direction:column;gap:9px}
  .shop-opt{
    border:2.5px solid var(--ink);border-radius:14px;background:var(--paper2);
    padding:13px 15px;font-family:var(--display);font-size:clamp(15px,2.6vw,18px);font-weight:600;
    box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;
    transition:transform .12s,box-shadow .12s,background .15s;
  }
  .shop-opt:hover{background:#FFF6E3;transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
  .shop-opt.correct{background:#D8F0DF;border-color:#1E7D6F;box-shadow:0 4px 0 #1E7D6F}
  .shop-opt.wrong{background:#FBE0D9;border-color:#C53F1B;box-shadow:0 4px 0 #C53F1B;animation:shake .36s}

  /* doctor */
  .doctor-stage{display:grid;grid-template-columns:1fr;gap:14px}
  .doctor-pic{display:grid;place-items:center;min-height:140px;background:var(--paper);border:2px solid rgba(31,42,40,.14);border-radius:16px;padding:12px}
  .doctor-pic .ph-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .doctor-pic .ph-row .shape-svg{width:64px;height:64px}
  .doctor-pic .ph-single .shape-svg{width:104px;height:104px}
  .doctor-pic .ph-emoji{font-size:84px}
  .doctor-pic .ph-room{width:180px;height:130px;border-radius:16px;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center;font-size:64px}
  .doctor-pic .ph-color{width:110px;height:110px;border-radius:50%;background:var(--c);border:2px solid var(--ink);display:grid;place-items:center;font-size:58px}
  .sick-card{
    display:flex;align-items:center;gap:12px;border:2.5px solid var(--ink);border-radius:15px;
    background:var(--paper2);padding:14px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;
    text-align:left;transition:transform .12s,box-shadow .12s,background .15s;
  }

let soundOn = localStorage.getItem('town_sound') !== '0';
let actx = null;
let cachedVoice = null;
let currentAudio = null;

function ac() {
  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type='sine', vol=.06) {
  if (!soundOn) return;
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur + .03);
}
function sfx(kind) {
  if (!soundOn) return;
  if (kind === 'flip') tone(520, 0, .08, 'triangle', .045);
  if (kind === 'ok')   { tone(660, 0, .12, 'sine', .07); tone(880, .09, .18, 'sine', .055); }
  if (kind === 'no')   { tone(180, 0, .16, 'sawtooth', .045); tone(140, .11, .2, 'sawtooth', .035); }
  if (kind === 'win')  { [523, 659, 784, 1047].forEach((f,i) => tone(f, i*.1, .3, 'sine', .055)); }
  if (kind === 'snap') { tone(900, 0, .05, 'square', .03); tone(1300, .05, .05, 'square', .025); }
}
function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  if (cachedVoice) return cachedVoice;
  const voices = window.speechSynthesis.getVoices() || [];
  cachedVoice = voices.find(v => /^en[-_](US|GB)/i.test(v.lang) && /female|samantha|zira|google/i.test(v.name))
             || voices.find(v => /^en/i.test(v.lang))
             || null;
  return cachedVoice;
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
}
function speakTTS(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .82; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

let sayAudio = null;
let sayRAF = null;
let sayEl = null;
let sayTimings = null;

function normSay(text) {
  return String(text).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim().toLowerCase();
}
function clearSayHighlight() {
  if (sayEl) sayEl.querySelectorAll('.say-w.on').forEach(w => w.classList.remove('on'));
  if (sayRAF) { cancelAnimationFrame(sayRAF); sayRAF = null; }
  sayEl = null;
  sayTimings = null;
}
function stopSay() {
  clearSayHighlight();
  if (sayAudio) {
    sayAudio.onended = null;
    sayAudio.onerror = null;
    try { sayAudio.pause(); } catch (e) {}
    sayAudio = null;
  }
}
function highlightLoop() {
  if (!sayAudio || !sayEl || !sayTimings) return;
  const t = sayAudio.currentTime;
  const words = sayEl.querySelectorAll('.say-w');
  let idx = -1;
  for (let i = 0; i < sayTimings.length; i++) {
    if (t >= sayTimings[i].s && t < sayTimings[i].e) { idx = i; break; }
    if (t >= sayTimings[i].e) idx = i;
  }
  words.forEach((w, i) => w.classList.toggle('on', i === idx));
  if (!sayAudio.paused && !sayAudio.ended) sayRAF = requestAnimationFrame(highlightLoop);
}
function say(text, voice = 'emma', el = null) {
  if (!soundOn) return;
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  const clips = window.AUDIO_MANIFEST && window.AUDIO_MANIFEST.clips;
  const clip = clips && clips[voice + '|' + normSay(text)];
  stopSay();
  if (!clip) { speakTTS(text); return; }
  const a = new Audio(clip.file);
  sayAudio = a;
  if (el) {
    sayEl = el;
    sayTimings = clip.timings || [];
    if (!sayTimings.length) {
      const words = el.querySelectorAll('.say-w');
      const dur = clip.duration || 1;
      sayTimings = Array.from(words).map((w, i) => ({ s: dur * i / words.length, e: dur * (i + 1) / words.length }));
    }
  }
  a.onplay = () => { if (sayEl) highlightLoop(); };
  a.onended = () => { clearSayHighlight(); sayAudio = null; };
  a.onerror = () => { stopSay(); speakTTS(text); };
  a.play().catch(() => { stopSay(); speakTTS(text); });
}
function speak(text) { say(text, 'emma'); }
const CAN_SPEAK = 'speechSynthesis' in window || !!(window.AUDIO_MANIFEST && window.AUDIO_MANIFEST.clips);

const rec = { stream:null, mr:null, chunks:[], onStop:null };
function cleanupAudio() {
  stopSay();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
  if (rec.mr) {
    rec.mr.onstop = null;
    rec.onStop = null;
    try { if (rec.mr.state === 'recording') rec.mr.stop(); } catch(e){}
    rec.mr = null;
  }
  if (rec.stream) {
    rec.stream.getTracks().forEach(t => t.stop());
    rec.stream = null;
  }
}
async function startRecording(onStop, onError) {
  if (!navigator.mediaDevices || !window.MediaRecorder) { onError('no-support'); return; }
  try {
    rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec.chunks = [];
    const mr = new MediaRecorder(rec.stream);
    rec.mr = mr;
    mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(rec.chunks, { type: mr.mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);
      if (rec.stream) { rec.stream.getTracks().forEach(t => t.stop()); rec.stream = null; }
      rec.mr = null;
      onStop(url);
    };
    mr.start();
  } catch (e) {
    onError(e && e.name ? e.name : 'error');
  }
}
function stopRecording() {
  if (rec.mr && rec.mr.state === 'recording') {
    try { rec.mr.stop(); } catch(e){}
  }
}
function playUrl(url, onEnded) {
  if (!url) return;
  stopSay();
  if (currentAudio) { try { currentAudio.pause(); } catch(e){} }
  const a = new Audio(url);
  currentAudio = a;
  a.onended = () => { if (onEnded) onEnded(); };
  a.play().catch(() => {});
}
function playAll(urls, done) {
  const list = urls.filter(Boolean);
  if (!list.length) { if (done) done(); return; }
  let i = 0;
  const next = () => {
    if (i >= list.length) { if (done) done(); return; }
    playUrl(list[i++], next);
  };
  next();
}

  session = { type:'photo', key:setKey, pool:PHOTO[setKey], rounds:shuffle(PHOTO[setKey]), i:0, score:0, locked:false };
  renderPhoto();
  goActivity();
}
function renderPhoto() {
  stopSay();
  const s = session;
  const r = s.rounds[s.i];
  const others = shuffle(s.pool.filter(x => x.key !== r.key).map(x => x.key)).slice(0, 3);
  const opts = shuffle([r.key, ...others]);
  const root = $('#activity-root');
  root.innerHTML = `
    ${actHeader('photo1')}
    ${progressBar('orange', s.i, s.rounds.length, `拍对 ${s.score} 张`)}
    <div class="panel">
      <div class="prompt-center">
        <span class="prompt-tag">听句子 · 拍照片</span>
        <button class="big-speaker" id="photo-speak" aria-label="再听一遍">
          ${ICON_SPEAKER}
        </button>
        <div class="prompt-zh" id="photo-zh">${CAN_SPEAK ? '听一听，哪张照片是这句话？' : '这个浏览器不能朗读，读一读：' + esc(r.en)}</div>
      </div>
      <div class="photo-grid">
        ${opts.map((k, idx) => `
          <button class="photo-opt" data-key="${k}">
            <span class="tag">${'ABCD'[idx]}</span>
            <div class="photo-frame">${sceneHTML(k)}</div>
          </button>`).join('')}
      </div>
      <div id="photo-feedback"></div>
    </div>`;
  bindBack();
  $('#photo-speak').addEventListener('click', () => { if (!soundOn) setSound(true); sfx('flip'); speak(r.en); });
  $$('.photo-opt', root).forEach(btn => btn.addEventListener('click', () => answerPhoto(btn, r, opts)));
  setTimeout(() => speak(r.en), 400);
}
function answerPhoto(btn, r, opts) {
  const s = session;
  if (s.locked) return;
  s.locked = true;
  const ok = btn.dataset.key === r.key;
  if (ok) {
    s.score++;
    btn.classList.add('correct');
    sfx('snap');
    const flash = $('#photo-flash');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    speak(r.en);
  } else {
    btn.classList.add('wrong');
    sfx('no');
    const right = $$('.photo-opt').find(b => b.dataset.key === r.key);
    if (right) right.classList.add('reveal');
    speak(r.en);
  }

function buildTrainRound() {
  const r = session.rounds[session.i];
  session.slots = Array(r.tokens.length).fill(null);

function renderTrain() {

        }).join('')}

  $('#train-clear').addEventListener('click', () => {

function placeChip(id) {
  const s = session;
  if (s.locked) return;
  const item = s.bank.find(b => b.id === id);
  if (!item || item.used) return;
  const idx = s.slots.findIndex(x => x === null);
  if (idx === -1) return;
  s.slots[idx] = id;
  item.used = true;
  sfx('flip');
  renderTrain();
}
function removeChip(idx) {

  if (s.locked) return;
  const id = s.slots[idx];

}

  const s = session;
  if (s.locked) return;

    return;
  }
  const made = s.slots.map(id => s.bank.find(b => b.id === id).text).join(' ');
  if (norm(made) === norm(r.en)) {

      s.i++;

  } else {
    s.mistakes++;
    sfx('no');

    if (line) { line.classList.add('shake'); setTimeout(() => line.classList.remove('shake'), 400); }
    showTrainFeedback(`再试一次，第一个词是 “${r.tokens[0]}”。`, 'bad');

function startMagician() {
  session = { type:'magician', rounds:shuffle(MAGIC).slice(0, 5), i:0, checks:0, placed:[], tool:'triangle' };
  goActivity();
  renderMagician();
}
function renderMagician() {
  stopSay();
  const s = session;
  const r = s.rounds[s.i];
  const root = $('#activity-root');
  root.innerHTML = `
    ${actHeader('magician')}
    ${progressBar('teal', s.i, s.rounds.length, `画对 ${s.i} 幅`)}
    <div class="panel">
      <div class="prompt-center" style="min-height:auto;padding-bottom:6px">
        <span class="prompt-tag">读句子 · 画图形</span>
        <div class="prompt-word">${esc(r.text)}</div>
        <div class="prompt-zh">${esc(r.zh)}</div>

      </div>
      <div class="tool-row" id="tool-row">
        ${['triangle','square','rectangle','diamond','heart','circle'].map(k => `
          <button class="shape-tool ${s.tool === k ? 'active' : ''}" data-tool="${k}" aria-label="${SHAPE_ZH[k]}">
            ${shapeSVG(k)}
          </button>`).join('')}
      </div>
      <div class="canvas-wrap">
        <canvas id="magic-canvas"></canvas>
        <div class="canvas-hint" id="canvas-hint">选一个形状，然后点画布</div>
      </div>
      <div class="btn-row">
        <button class="btn" id="magic-undo">撤销</button>

        <button class="btn primary" id="magic-check">画好了</button>
      </div>

    </div>`;
  bindBack();
  $$('.shape-tool', root).forEach(btn => btn.addEventListener('click', () => {
    s.tool = btn.dataset.tool;
    $$('.shape-tool').forEach(b => b.classList.toggle('active', b === btn));
  }));
  $('#magic-listen').addEventListener('click', () => speak(r.text));
  $('#magic-undo').addEventListener('click', () => { s.placed.pop(); drawMagic(); });
  $('#magic-clear').addEventListener('click', () => { s.placed = []; drawMagic(); });
  $('#magic-check').addEventListener('click', checkMagic);
  setupMagicCanvas();
  speak(r.text);
}
function setupMagicCanvas() {
  const canvas = $('#magic-canvas');
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.onclick = e => {
    if (session.locked) return;
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    session.placed.push({ shape: session.tool, x, y });
    sfx('flip');
    drawMagic();
  };
  drawMagic();
}
function drawMagic() {
  const canvas = $('#magic-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.clearRect(0, 0, w, h);
  const size = Math.min(w, h) * 0.16;
  session.placed.forEach(p => drawOneShape(ctx, p.shape, p.x * w, p.y * h, size));
  const hint = $('#canvas-hint');
  if (hint) hint.classList.toggle('hide', session.placed.length > 0);
}
function drawOneShape(ctx, shape, cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#1F2A28';
  ctx.fillStyle = SHAPE_COLOR[shape] || '#F2B93B';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (shape === 'triangle') {
    ctx.moveTo(0, -s * 0.55);
    ctx.lineTo(s * 0.58, s * 0.45);
    ctx.lineTo(-s * 0.58, s * 0.45);
    ctx.closePath();
  } else if (shape === 'square') {
    ctx.rect(-s * 0.45, -s * 0.45, s * 0.9, s * 0.9);
  } else if (shape === 'rectangle') {
    ctx.rect(-s * 0.62, -s * 0.34, s * 1.24, s * 0.68);
  } else if (shape === 'diamond') {
    ctx.moveTo(0, -s * 0.58);
    ctx.lineTo(s * 0.55, 0);
    ctx.lineTo(0, s * 0.58);
    ctx.lineTo(-s * 0.55, 0);
    ctx.closePath();
  } else if (shape === 'heart') {
    ctx.moveTo(0, s * 0.5);
    ctx.bezierCurveTo(-s * 0.72, -s * 0.02, -s * 0.36, -s * 0.62, 0, -s * 0.22);
    ctx.bezierCurveTo(s * 0.36, -s * 0.62, s * 0.72, -s * 0.02, 0, s * 0.5);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, s * 0.48, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}
function checkMagic() {
  const s = session;
  if (s.locked) return;
  const r = s.rounds[s.i];
  const counts = {};
  s.placed.forEach(p => { counts[p.shape] = (counts[p.shape] || 0) + 1; });
  const need = r.req;
  const keys = Object.keys(need);
  let ok = keys.every(k => (counts[k] || 0) === need[k]) && Object.keys(counts).every(k => (need[k] || 0) === counts[k]);
  if (ok) {
    s.locked = true;
    sfx('ok');
    speak(r.text);
    const fb = $('#magic-feedback');
    if (fb) fb.innerHTML = `<div class="feedback good">画对了！${esc(r.text)}</div>`;
    setTimeout(() => {
      s.i++;
      s.placed = [];
      s.locked = false;
      if (s.i >= s.rounds.length) endMagician();
      else renderMagician();
    }, 1700);
  } else {
    s.checks++;
    sfx('no');
    const parts = [];
    keys.forEach(k => {
      const have = counts[k] || 0;
      if (have !== need[k]) parts.push(`${SHAPE_ZH[k]}需要 ${need[k]} 个，你画了 ${have} 个`);
    });
    const extra = Object.keys(counts).filter(k => !need[k]);
    extra.forEach(k => parts.push(`多了 ${counts[k]} 个${SHAPE_ZH[k]}`));
    const fb = $('#magic-feedback');
    if (fb) fb.innerHTML = `<div class="feedback bad">${esc(parts.join('；'))}。可以撤销再补一补。</div>`;
  }
}
function endMagician() {
  const c = session.checks;
  const stars = c <= 1 ? 3 : c <= 3 ? 2 : 1;
  finishActivity('magician', stars, `5 幅画都完成了，中间调整了 ${c} 次。${stars === 3 ? '读句画图一次就对！' : '画之前先数一数数量。'}`);
}

      <div class="room-grid">
        ${ROOMS.map(room => `
          <button class="room-tile" data-key="${room.key}">
            <span class="room-emoji">${room.emoji}</span>
            <span class="room-zh">${room.name}</span>
            <span class="room-en">${room.en}</span>
          </button>`).join('')}
      </div>
      <div id="map-feedback"></div>
    </div>`;
  bindBack();
  $('#map-speak').addEventListener('click', () => { if (!soundOn) setSound(true); sfx('flip'); speak(r.en); });
  $$('.room-tile', root).forEach(btn => btn.addEventListener('click', () => answerMap(btn, r)));
  setTimeout(() => speak(r.en), 400);
}
function answerMap(btn, r) {
  const s = session;
  if (s.locked) return;
  s.locked = true;
  const ok = btn.dataset.key === r.room;
  const tiles = $$('.room-tile');
  if (ok) {
    s.score++;
    btn.classList.add('correct');
    btn.classList.add('reveal');
    sfx('ok');
  } else {
    btn.classList.add('wrong');
    sfx('no');
    const right = tiles.find(t => t.dataset.key === r.room);
    if (right) { right.classList.add('correct'); right.classList.add('reveal'); }
  }
  tiles.forEach(t => t.disabled = true);
  speak(r.en);
  const room = ROOMS.find(x => x.key === r.room);
  const fb = $('#map-feedback');
  if (fb) fb.innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${esc(r.en)} · ${esc(room.name)}（${esc(room.en)}）</div>`;
  setTimeout(() => {
    s.i++;
    if (s.i >= s.rounds.length) endMap();
    else { s.locked = false; renderMap(); }
  }, ok ? 1600 : 2200);
}
function endMap() {
  const n = session.rounds.length;
  const stars = session.score >= n - 1 ? 3 : session.score >= n - 3 ? 2 : 1;
  finishActivity('map', stars, `8 个地方，听对了 ${session.score} 个。${stars === 3 ? '校园地点听得很准！' : '注意 music room、art room、gym、library 的区别。'}`);
}

    <div class="panel">

        <div class="prompt-tag">第 ${s.i + 1} 站 · 校园导游</div>
        <div class="tour-room">${stop.emoji}</div>
        <div class="rec-sentence" id="tour-sentence">${wordSpans(stop.en)}</div>
        <div class="rec-zh">${esc(stop.zh)}</div>
        <div class="rec-actions">
          <button class="mini-speaker" id="tour-listen">🔊 听一遍</button>

        </div>
        <div class="rec-actions">
          <button class="btn" id="tour-play" ${hasUrl ? '' : 'disabled'}>▶ 回放</button>
          <button class="btn primary" id="tour-next">下一站 →</button>
        </div>
        <div class="rec-status" style="opacity:.75">录音可以多拿星星；不方便录音也可以直接下一站。</div>
      </div>
      <div id="tour-feedback"></div>
    </div>`;
  bindBack();
  $('#tour-listen').addEventListener('click', () => say(stop.en, 'emma', $('#tour-sentence')));
  $('#tour-rec').addEventListener('click', () => {
    if (s.recording) { stopRecording(); return; }
    s.recording = true;
    renderTour();

      s.recording = false;
      s.urls[idx] = url;
      s.recorded = Object.keys(s.urls).length;
      sfx('ok');
      renderTour();
    }, err => {
      s.recording = false;
      s.micBlocked = true;

      const fb = $('#tour-feedback');
      if (fb) fb.innerHTML = `<div class="feedback bad">浏览器没有打开麦克风（${esc(err)}）。跟着读一遍，也可以继续下一站。</div>`;
    });
  });
  $('#tour-play').addEventListener('click', () => { if (s.urls[s.i]) playUrl(s.urls[s.i]); });
  $('#tour-next').addEventListener('click', () => {
    if (s.recording) { stopRecording(); }
    s.i++;
    if (s.i >= TOUR.length) endTour();
    else renderTour();
  });
  if (s.spokenStop !== s.i) {
    s.spokenStop = s.i;
    setTimeout(() => say(stop.en, 'emma', $('#tour-sentence')), 350);
  }
}
function endTour() {
  const s = session;
  const urls = TOUR.map((_, i) => s.urls[i]);
  const stars = s.recorded >= 4 ? 3 : s.recorded >= 2 ? 2 : 1;
  finishActivity('tour', stars,
    `4 站都参观完了，录了 ${s.recorded} 段导游词。${stars === 3 ? '你的英语导游词很棒！' : '下次可以试着把四段都录下来。'}`,
    s.recorded ? { label:'▶ 播放我的导游词', action: () => playAll(urls) } : null

}

/* =========================================================
   彩带
   ========================================================= */
const confettiCanvas = $('#confetti');
const cctx = confettiCanvas.getContext('2d');
let particles = [];
let confettiRAF = null;
function sizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  confettiCanvas.width = window.innerWidth * dpr;
  confettiCanvas.height = window.innerHeight * dpr;
  confettiCanvas.style.width = window.innerWidth + 'px';
  confettiCanvas.style.height = window.innerHeight + 'px';
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
window.addEventListener('resize', sizeCanvas);
function confetti() {
  const colors = ['#E4572E','#2A9D8F','#F2B93B','#3E6FD1','#E0698E','#3FA34D'];
  particles = [];
  const count = window.innerWidth < 600 ? 70 : 120;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: window.innerWidth / 2 + (Math.random() - .5) * 220,
      y: window.innerHeight * .32 + (Math.random() - .5) * 80,
      vx: (Math.random() - .5) * 11,
      vy: -Math.random() * 10 - 3,
      w: 6 + Math.random() * 7,
      h: 5 + Math.random() * 8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1
    });
  }
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  const start = performance.now();
  const tick = now => {
    const elapsed = now - start;
    cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles.forEach(p => {
      p.vy += .28; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.life = Math.max(0, 1 - elapsed / 2600);
      cctx.save();
      cctx.globalAlpha = p.life;
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    });
    if (elapsed < 2700) confettiRAF = requestAnimationFrame(tick);
    else cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  };
  confettiRAF = requestAnimationFrame(tick);
}
